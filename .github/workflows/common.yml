name: Download, Split & Upload to Release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '🔗 Direct download URL (must be a direct link, not HTML page)'
        required: true
        type: string
      part_size_mb:
        description: '📦 Part size in MB (max 1990 to stay under GitHub 2GB limit)'
        required: false
        default: '1800'
        type: string
      release_tag:
        description: '🏷️ Release tag (leave empty to auto-generate)'
        required: false
        default: ''
        type: string
      file_extension:
        description: '📄 File extension for parts (e.g. .pkg)'
        required: false
        default: '.pkg'
        type: string

jobs:
  download-split-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # حذف ابزارهای غیرضروری برای آزادسازی فضا
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Download, split & upload incrementally
        env:
          URL: ${{ inputs.download_url }}
          PART_MB: ${{ inputs.part_size_mb }}
          EXT: ${{ inputs.file_extension }}
          TAG: ${{ inputs.release_tag || format('release-{0}', github.run_number) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail

          PART_BYTES=$((PART_MB * 1024 * 1024))
          echo "📦 Part size: ${PART_MB} MB"
          echo "🏷️  Release tag: $TAG"

          # --- بررسی اندازه واقعی فایل با HEAD request ---
          echo "🔍 Checking file size..."
          EXPECTED_BYTES=$(curl -sIL --retry 3 "$URL" \
            | grep -i '^content-length:' | tail -1 \
            | awk '{print $2}' | tr -d '\r')

          if [ -z "${EXPECTED_BYTES:-}" ] || ! [[ "$EXPECTED_BYTES" =~ ^[0-9]+$ ]]; then
            echo "⚠️  Could not determine file size — will proceed without validation"
            EXPECTED_BYTES=0
          else
            echo "📏 Expected file size: $(numfmt --to=iec "$EXPECTED_BYTES")"
          fi

          # --- بررسی حداقل فضای دیسک لازم (یک قطعه + بافر) ---
          AVAIL=$(df --output=avail -B1 / | tail -1)
          NEEDED=$((PART_BYTES * 2))
          if [ "$AVAIL" -lt "$NEEDED" ]; then
            echo "❌ Not enough disk space: $AVAIL bytes available, need $NEEDED"
            exit 1
          fi

          # --- ساخت Release ---
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Release $TAG" \
            --notes "Automated upload. Download all parts and merge with: cat *${EXT}.part* > final${EXT}" \
            --target "$(git rev-parse HEAD)"
          echo "✅ Release created"

          # --- شروع دانلود و تقسیم همزمان ---
          echo "⬇️  Starting download+split stream..."
          ( curl -sL --retry 10 --retry-delay 10 --retry-connrefused \
                 --connect-timeout 60 --max-time 21600 \
                 -o - "$URL" \
              | split -b "${PART_MB}M" - "part_" ) &
          PIPE_PID=$!

          # --- آپلود تدریجی و حذف قطعات ---
          UPLOADED_LIST=$(mktemp)
          TOTAL_UPLOADED=0
          PART_INDEX=0

          while kill -0 "$PIPE_PID" 2>/dev/null; do
            for f in part_*; do
              [ -f "$f" ] || continue
              grep -qxF "$f" "$UPLOADED_LIST" && continue

              size=$(stat -c%s "$f")
              # فقط قطعات کامل‌شده (به اندازه کافی بزرگ) را آپلود کن
              if [ "$size" -ge "$PART_BYTES" ]; then
                PART_INDEX=$((PART_INDEX + 1))
                RENAMED=$(printf "game%s.part%03d" "$EXT" "$PART_INDEX")
                mv "$f" "$RENAMED"

                echo "📤 Uploading $RENAMED ($(numfmt --to=iec "$size"))..."
                if gh release upload "$TAG" "$RENAMED" --repo "$REPO" --clobber; then
                  echo "$RENAMED" >> "$UPLOADED_LIST"
                  TOTAL_UPLOADED=$((TOTAL_UPLOADED + size))
                  rm -f "$RENAMED"
                  echo "   ✔ Uploaded & cleaned. Progress: $(numfmt --to=iec "$TOTAL_UPLOADED")"
                else
                  echo "   ❌ Upload failed for $RENAMED"
                fi
              fi
            done
            sleep 10
          done

          wait "$PIPE_PID" || true

          # --- آپلود آخرین قطعه (کوچک‌تر از اندازه استاندارد) ---
          for f in part_*; do
            [ -f "$f" ] || continue
            grep -qxF "$f" "$UPLOADED_LIST" && continue
            size=$(stat -c%s "$f")
            PART_INDEX=$((PART_INDEX + 1))
            RENAMED=$(printf "game%s.part%03d" "$EXT" "$PART_INDEX")
            mv "$f" "$RENAMED"
            echo "📤 Uploading final part $RENAMED ($(numfmt --to=iec "$size"))..."
            gh release upload "$TAG" "$RENAMED" --repo "$REPO" --clobber
            TOTAL_UPLOADED=$((TOTAL_UPLOADED + size))
            rm -f "$RENAMED"
          done

          # --- اعتبارسنجی نهایی ---
          echo "═══════════════════════════════"
          echo "📊 Total uploaded: $(numfmt --to=iec "$TOTAL_UPLOADED")"
          echo "📊 Expected:      $(numfmt --to=iec "$EXPECTED_BYTES")"

          if [ "$EXPECTED_BYTES" -gt 0 ] && [ "$TOTAL_UPLOADED" -ne "$EXPECTED_BYTES" ]; then
            echo "❌ SIZE MISMATCH! Download was likely interrupted."
            echo "   Re-run the workflow to retry."
            exit 1
          fi

          echo "✅ Done! Release: https://github.com/$REPO/releases/tag/$TAG"
          echo "💡 Users can merge parts with: cat game*${EXT}.part* > game${EXT}"
