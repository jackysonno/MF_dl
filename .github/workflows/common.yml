name: Manual URL to Release Large File

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: 'Direct Download URL (لینک مستقیم دانلود)'
        required: true
        type: string
      release_tag:
        description: 'GitHub Release Tag e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download_split_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          df -h

      - name: Download Large File
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          wget --tries=5 --retry-connrefused --continue \
            --user-agent="$UA" \
            --content-disposition \
            "${{ github.event.inputs.mediafire_url }}"

          FILENAME=$(find . -maxdepth 1 -type f -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)

          if [ -z "$FILENAME" ] || [ ! -f "$FILENAME" ]; then
            echo "::error::Download failed or file not found"
            exit 1
          fi

          echo "Downloaded file: $FILENAME"
          du -h "$FILENAME"

          split -b 1900M "$FILENAME" "${FILENAME}.part"
          rm -f "$FILENAME"
          ls -lah

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: |
            *.part*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
